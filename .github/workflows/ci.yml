name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Pushing three times in a minute ran eighteen jobs, and the first twelve were already pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: api/**/packages.lock.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test tests/Linkbelli.Tests/Linkbelli.Tests.csproj --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory coverage

      # Infrastructure's pure logic, apart so it needs neither Docker nor a database: who can
      # reach the job dashboard, whether a stored secret comes back.
      - name: Infrastructure unit tests
        run: >
          dotnet test tests/Linkbelli.Infrastructure.Tests/Linkbelli.Infrastructure.Tests.csproj --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory coverage

      # coverlet was a dependency of both test projects and was never once invoked, so nobody
      # knew what was covered. Published rather than gated: the useful finding is which
      # directories sit at zero, not the headline percentage.
      - name: Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

      # Fail the build on known-vulnerable (incl. transitive) NuGet dependencies.
      # The severity is the third column of a "   > Package  Version  Severity  Advisory" line,
      # not the first thing after the ">" — the earlier pattern anchored on the wrong column and
      # so matched nothing, which meant this gate passed while two high-severity advisories were
      # live in the tree.
      - name: Vulnerable dependency scan
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.log
          ! grep -q -E '^[[:space:]]*>.*(Low|Moderate|High|Critical)' vuln.log

  integration-test:
    runs-on: ubuntu-latest
    # GitHub-hosted ubuntu runners ship Docker, which Testcontainers needs.
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: api/**/packages.lock.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Real-Postgres suite: auth, scope enforcement, visibility, rate limiting,
      # admin moderation, NSFW, SSRF — the authz/IDOR safety net.
      - name: Integration tests
        run: dotnet test tests/Linkbelli.IntegrationTests/Linkbelli.IntegrationTests.csproj --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

  # A source file that .gitignore swallows is invisible: it builds locally, because Docker reads
  # the filesystem, and only fails somewhere that builds from a clean checkout. The stock
  # VisualStudio template this repo started from has a dozen unanchored directory patterns
  # (Backup*/, [Ll]og/, artifacts/, publish/ …) that match plausible source folder names, so this
  # checks the outcome rather than trying to enumerate them.
  no-ignored-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No source file is gitignored
        run: |
          leaked=$(git ls-files --others --ignored --exclude-standard             -- api/src api/tests web/src mcp/src email-worker/src extension/src             | grep -vE '(^|/)(bin|obj|node_modules|\.svelte-kit)/|\.user$' || true)
          if [ -n "$leaked" ]; then
            echo "These files are ignored by .gitignore and would never reach a build:"
            echo "$leaked"
            exit 1
          fi

  email-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: email-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test
