services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkbelli
      POSTGRES_USER: linkbelli
      POSTGRES_PASSWORD: linkbelli
    ports:
      # 5433 on the host: a native PostgreSQL 17 service already occupies 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkbelli"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # Development here so the local full-stack run keeps Scalar and skips HTTPS redirection.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=linkbelli;Username=linkbelli;Password=linkbelli
      Database__MigrateAtStartup: "true"
      # Persist the Data Protection key ring so tokens/secrets survive container restarts.
      DataProtection__KeyRingPath: /keys
      # Cached link thumbnails, so they are served from here rather than hotlinked from the
      # sites they came from. A volume, so a container restart doesn't refetch everything.
      Thumbnails__CachePath: /thumbnails
      # Where humans read a public playlist, so syndicated feeds link to the web app
      # rather than back at this API.
      PublicWebBaseUrl: http://localhost:5173
      # Mail. Every one of these reads from .env if it is set there, and otherwise falls back to
      # the local catch-all — so `docker compose up` works with no .env at all, and pointing at a
      # real provider means writing a file rather than editing this one. See .env.example.
      #
      # The defaults are Mailpit: no credentials and no TLS, because it is a container on this
      # machine that speaks plaintext on purpose.
      Email__Host: ${Email__Host:-mailpit}
      Email__Port: ${Email__Port:-1025}
      Email__UseTls: ${Email__UseTls:-false}
      Email__Username: ${Email__Username:-}
      Email__Password: ${Email__Password:-}
      Email__FromAddress: ${Email__FromAddress:-no-reply@linkbelli.local}
      Email__FromName: ${Email__FromName:-Linkbelli}
      Email__PublicUrl: ${Email__PublicUrl:-http://localhost:5173}
      # Only needed for email-in, and only so the app can show somebody their inbox address.
      Email__InboxDomain: ${Email__InboxDomain:-}
    ports:
      - "5180:8080"
    volumes:
      - dpkeys:/keys
      - thumbnails:/thumbnails

  # Catches every message the API sends and shows them at http://localhost:8025. No account,
  # no domain, no provider — and nothing can accidentally reach a real person from a dev box.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: "500"

  web:
    build: ./web
    depends_on:
      - api
    environment:
      # BFF talks to the API over the compose network; the browser only ever sees the web app.
      API_BASE_URL: http://api:8080
      # adapter-node's public origin (for form-action CSRF checks) = how the browser reaches it.
      ORIGIN: http://localhost:5173
      # Local run is plain HTTP, so don't mark auth cookies Secure (browser would drop them).
      COOKIE_SECURE: "false"
    ports:
      - "5173:3000"

volumes:
  pgdata:
  dpkeys:
  thumbnails:
